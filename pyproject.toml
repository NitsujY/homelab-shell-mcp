[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homelab-shell-mcp"
version = "0.1.0"
description = "Security-first shell execution MCP server for a homelab LXC"
requires-python = ">=3.12"
# Auth API verified against fastmcp 3.4.7; pin major to avoid silent API drift.
dependencies = ["fastmcp>=3.4,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
homelab-shell-mcp = "homelab_shell_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_shell_mcp.py"]
